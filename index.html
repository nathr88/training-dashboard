<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Dashboard</title>

    style.css

    https://cdn.jsdelivr.net/npm/chart.jsscript>
</head>

<body>

<div class="container">

    <h1>Weekly Training Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Distance</h3>
            <p id="distance"></p>
        </div>

        <div class="card">
            <h3>Total TSS</h3>
            <p id="tss"></p>
        </div>

        <div class="card">
            <h3>Total Work</h3>
            <p id="work"></p>
        </div>

        <div class="card">
            <h3>Total Elevation</h3>
            <p id="elevation"></p>
        </div>

    </div>

    <canvas id="distanceChart"></canvas>

    <canvas id="tssChart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
