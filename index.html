<!DOCTYPE html>
<html>
<head>
    <title>Training Dashboard</title>

    <link rel="stylesheet" href=sdelivr.net/npm/chart.jsscript>
</head>

<body>

<div class="container">
    <h1>Weekly Training Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Distance</h3>
            <p id="distance"></p>
        </div>

        <div class="card">
            <h3>Total TSS</h3>
            <p id="tss"></p>
        </div>

        <div class="card">
            <h3>Total Work</h3>
            <p id="work"></p>
        </div>

        <div class="card">
            <h3>Total Elevation</h3>
            <p id="elevation"></p>
        </div>

    </div>

    <canvas id="distanceChart"></canvas>

    <canvas id="tssChart"></canvas>

</div>

script.jsscript>

</body>
</html>
